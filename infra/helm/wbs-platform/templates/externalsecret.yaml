{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "wbs-platform.fullname" . }}-secrets
  labels:
    {{- include "wbs-platform.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName }}
    kind: {{ .Values.externalSecret.secretStoreKind | default "SecretStore" }}
  target:
    name: {{ include "wbs-platform.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecret.remoteKeyPrefix }}/database-url
    - secretKey: OPENPROJECT_API_TOKEN
      remoteRef:
        key: {{ .Values.externalSecret.remoteKeyPrefix }}/openproject-api-token
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.remoteKeyPrefix }}/smtp-password
    {{- if .Values.externalSecret.extraKeys }}
    {{- range .Values.externalSecret.extraKeys }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
    {{- end }}
    {{- end }}
{{- end }}
